# Lightweight CI validates deterministic pure-Python components. Quantum and
# chemistry integration tests require the pinned CUDA-Q/PySCF stack and are
# run explicitly by `make all` on a provisioned Linux runner or Colab T4.
name: unit-tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install pytest==9.2.0 numpy==2.3.4 scipy==1.16.3 matplotlib==3.10.7
      - name: Static Python validation
        run: python -m compileall -q src tests
      - name: Run non-integration tests
        run: python -m pytest -q -m 'not integration and not slow'
